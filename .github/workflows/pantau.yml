name: Pantau sinyal

on:
  schedule:
    - cron: '*/15 2-8 * * 1-5'   # tiap 15 menit, 09:00-15:45 WIB (GitHub bisa terlambat beberapa menit)
    - cron: '20 10 * * 1-5'      # 17:20 WIB: evaluasi harian dan ringkasan
  workflow_dispatch:
    inputs:
      mode:
        description: 'intraday atau harian'
        default: 'intraday'

concurrency:
  group: pantau
  cancel-in-progress: false

jobs:
  pantau:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-tugas.txt
      - run: pip install -r requirements-tugas.txt
      - name: Jalankan tugas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          MODE="$MODE_INPUT"
          if [ -z "$MODE" ]; then
            if [ "$(date -u +%H)" = "10" ]; then MODE=harian; else MODE=intraday; fi
          fi
          python tugas/pantau.py "$MODE"
